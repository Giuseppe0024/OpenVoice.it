<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{index :: head}"></head>
<body class="d-flex flex-column min-vh-100">
    <header th:insert="~{index :: navbar}"></header>

    <main class="flex-grow-1 my-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">

                    <div class="card editor-card-form p-4 p-md-5">
                        <div class="text-center mb-4">
                            <span class="badge bg-orange text-white text-uppercase px-3 py-2 rounded-pill mb-2">Modifica Rubrica</span>
                            <h1 class="h3 font-serif-brand fw-bold mb-1" th:text="${title}">Modifica la categoria</h1>
                            <p class="text-muted small">Aggiorna il nome della rubrica esistente</p>
                        </div>

                        <form th:action="@{/categories/update/{id}(id=${category.id})}" method="post" th:object="${category}">
                            <div class="mb-4">
                                <label for="name" class="form-label fw-semibold text-secondary small">Nome Categoria</label>
                                <input id="name" type="text" class="form-control form-control-lg rounded-3 fs-6" th:field="*{name}" placeholder="Inserisci il nuovo nome...">
                                <p th:errors="*{name}" class="text-danger small mt-1 mb-0" th:if="${#fields.hasErrors('name')}"></p>
                            </div>

                            <div class="d-flex justify-content-between align-items-center pt-2">
                                <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary rounded-pill px-4">Annulla</a>
                                <button type="submit" class="btn btn-orange rounded-pill px-4 py-2">
                                    <i class="fa-solid fa-floppy-disk me-1"></i> Aggiorna Categoria
                                </button>
                            </div>
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <footer th:insert="~{index :: footer}"></footer>
    <script th:replace="~{index :: bootstrapScript}"></script>
</body>
</html>
