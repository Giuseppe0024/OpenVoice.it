<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{index :: head}"></head>
<body class="d-flex flex-column min-vh-100">
    <header th:insert="~{index :: navbar}"></header>

    <main class="flex-grow-1 my-5">
        <div class="container">

            <!-- Alert Success -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show border-0 shadow-sm d-flex align-items-center mb-4" role="alert">
                <i class="fa-solid fa-circle-check fs-5 me-2 text-success"></i>
                <div th:text="${successMessage}"></div>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Header Dashboard Writer -->
            <div class="dashboard-header-card mb-5">
                <div class="row align-items-center">
                    <div class="col-md-8">
                        <span class="badge badge-sunset text-uppercase px-3 py-2 rounded-pill mb-2">Desk Redazionale</span>
                        <h1 class="display-6 font-serif-brand fw-bold mb-1">Dashboard Writer</h1>
                        <p class="text-muted mb-0">Gestisci i tuoi articoli, monitora lo stato e correggi i testi prima della revisione.</p>
                    </div>
                    <div class="col-md-4 text-md-end mt-3 mt-md-0">
                        <a th:href="@{/articles/create}" class="btn btn-sunset rounded-pill px-4 py-2">
                            <i class="fa-solid fa-pen-nib me-2"></i> Scrivi Articolo
                        </a>
                    </div>
                </div>
            </div>

            <!-- Tabella Articoli dello Scrittore -->
            <div class="mb-5">
                <div class="d-flex align-items-center justify-content-between mb-3">
                    <h2 class="h4 font-serif-brand fw-bold mb-0 d-flex align-items-center gap-2">
                        <span class="badge rounded-circle p-2 bg-orange bg-opacity-10 text-orange">
                            <i class="fa-solid fa-feather-pointed"></i>
                        </span>
                        <span th:text="${title}">I tuoi articoli</span>
                    </h2>
                    <span class="badge bg-secondary-subtle text-secondary px-3 py-2 rounded-pill small" th:text="${articles != null ? articles.size() + ' Articoli' : '0'}"></span>
                </div>

                <div class="dashboard-table-container">
                    <div class="table-responsive">
                        <table class="table table-modern table-hover align-middle mb-0">
                            <thead>
                                <tr>
                                    <th style="width: 80px;">ID</th>
                                    <th>Titolo</th>
                                    <th>Sottotitolo</th>
                                    <th>Categoria</th>
                                    <th class="text-end">Azioni</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="article : ${articles}">
                                    <td class="fw-bold text-muted" th:text="'#' + ${article.id}"></td>
                                    <td>
                                        <span class="fw-bold text-dark fs-6" th:text="${article.title}"></span>
                                    </td>
                                    <td>
                                        <span class="text-muted small" th:text="${article.subtitle}"></span>
                                    </td>
                                    <td>
                                        <span th:if="${article.category}" class="badge bg-purple text-white px-3 py-2 rounded-pill fw-medium" th:text="${article.category.name}"></span>
                                        <span th:unless="${article.category}" class="badge bg-light text-secondary border px-3 py-2 rounded-pill">Nessuna categoria</span>
                                    </td>
                                    <td class="text-end">
                                        <div class="d-inline-flex gap-2">
                                            <a th:href="@{/articles/detail/{id}(id=${article.id})}" class="btn btn-sunset btn-action-icon shadow-sm" title="Vedi Articolo">
                                                <i class="fa-solid fa-eye text-white"></i>
                                            </a>
                                            <a th:href="@{/articles/edit/{id}(id=${article.id})}" class="btn btn-orange btn-action-icon shadow-sm" title="Modifica Articolo">
                                                <i class="fa-solid fa-pen text-white"></i>
                                            </a>
                                            <a th:href="@{/articles/delete/{id}(id=${article.id})}" class="btn btn-danger btn-action-icon shadow-sm" title="Elimina Articolo">
                                                <i class="fa-solid fa-trash text-white"></i>
                                            </a>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${articles == null or articles.isEmpty()}">
                                    <td colspan="5" class="text-center py-5 text-muted">
                                        <i class="fa-solid fa-pen-fancy fs-2 text-secondary opacity-50 d-block mb-2"></i>
                                        Non hai ancora scritto nessun articolo. Inizia subito cliccando su "Scrivi Articolo"!
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <footer th:insert="~{index :: footer}"></footer>
    <script th:replace="~{index :: bootstrapScript}"></script>
</body>
</html>
