<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{index :: head}"></head>
<body class="d-flex flex-column min-vh-100">
    <header th:insert="~{index :: navbar}"></header>

    <main class="flex-grow-1">
        <!-- Hero Testata Revisione -->
        <header class="article-hero-header text-center">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-lg-10 col-xl-8">
                        <span class="badge badge-sunset text-uppercase px-3 py-2 rounded-pill mb-3">Revisione Editoriale</span>
                        
                        <div class="mb-3">
                            <span th:if="${article.category != null}" class="category-badge-pill">
                                <i class="fa-solid fa-tag"></i> <span th:text="${article.category.name}"></span>
                            </span>
                            <span th:if="${article.category == null}" class="badge bg-secondary-subtle text-secondary px-3 py-2 rounded-pill">Nessuna Categoria</span>
                        </div>

                        <h1 class="display-5 font-serif-brand fw-bold mb-3 text-dark" th:text="${article.title}">Titolo Articolo</h1>
                        <p class="lead text-muted mb-4" th:text="${article.subtitle}">Sottotitolo...</p>

                        <div class="d-flex align-items-center justify-content-center gap-3 text-muted small border-top border-bottom py-2 d-inline-flex px-4">
                            <span class="d-flex align-items-center">
                                <i class="fa-solid fa-user-pen me-2 text-danger"></i>
                                <span th:text="${article.user.username}">Autore</span>
                            </span>
                            <span>•</span>
                            <span class="d-flex align-items-center">
                                <i class="fa-regular fa-clock me-2"></i>
                                <span th:text="${article.publishDate}">Data</span>
                            </span>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Corpo dell'Articolo & Decisione Revisor -->
        <article class="container my-5">
            <div class="row justify-content-center">
                <div class="col-lg-10 col-xl-8">

                    <!-- Carosello Media -->
                    <div id="carouselExample" class="carousel slide article-carousel mb-5">
                        <div class="carousel-inner">
                            <div class="carousel-item active">
                                <img th:if="${article.image != null}" th:src="${article.image.path}" class="article-carousel-img" alt="Immagine articolo">
                                <img th:unless="${article.image != null}" th:src="@{/default.jpg}" class="article-carousel-img" alt="Immagine default">
                            </div>
                        </div>
                        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
                            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                            <span class="visually-hidden">Previous</span>
                        </button>
                        <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
                            <span class="carousel-control-next-icon" aria-hidden="true"></span>
                            <span class="visually-hidden">Next</span>
                        </button>
                    </div>

                    <!-- Testo Integrale -->
                    <div class="article-content-body p-4 p-md-5 rounded-4 bg-white border shadow-sm mb-5">
                        <p th:text="${article.body}"></p>
                    </div>

                    <!-- Control Panel di Accettazione o Rifiuto -->
                    <div class="card p-4 rounded-4 border-0 shadow-lg" style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);">
                        <div class="row align-items-center gy-3">
                            <div class="col-md-6">
                                <h4 class="text-white font-serif-brand mb-1">Verdetto Editoriale</h4>
                                <p class="text-secondary small mb-0">Decidi se approvare e mandare online l'articolo o respingerlo.</p>
                            </div>
                            <div class="col-md-6 d-flex justify-content-md-end gap-2">
                                <form th:action="@{/articles/accept(action='reject', articleId=${article.id})}" method="post" th:object="${article}" class="m-0">
                                    <button type="submit" class="btn btn-outline-danger rounded-pill px-4 py-2 fw-semibold">
                                        <i class="fa-solid fa-xmark me-2"></i> Rifiuta
                                    </button>
                                </form>
                                <form th:action="@{/articles/accept(action='accept', articleId=${article.id})}" method="post" class="m-0">
                                    <button type="submit" class="btn btn-sunset rounded-pill px-4 py-2 fw-semibold">
                                        <i class="fa-solid fa-check me-2"></i> Accetta e Pubblica
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>

                    <div class="text-center mt-4">
                        <a href="#" class="text-secondary small text-decoration-none fw-semibold" onclick="goBack()">
                            <i class="fa-solid fa-arrow-left me-1"></i> Torna indietro
                        </a>
                    </div>

                </div>
            </div>
        </article>
    </main>

    <footer th:insert="~{index :: footer}"></footer>
    <script th:replace="~{index :: bootstrapScript}"></script>
    <script>
        function goBack() {
            window.history.back();
        }
    </script>
</body>
</html>
