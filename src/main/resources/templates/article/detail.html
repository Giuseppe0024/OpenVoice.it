<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{index :: head}"></head>
<body class="d-flex flex-column min-vh-100">
    <header th:insert="~{index :: navbar}"></header>

    <main class="flex-grow-1">
        <!-- Hero Testata Articolo -->
        <header class="article-hero-header text-center">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-lg-10 col-xl-8">
                        <!-- Categoria Badge -->
                        <div class="mb-3">
                            <a th:if="${article.category != null}" 
                               th:href="@{/categories/search/{id}(id=${article.category.id})}" 
                               class="category-badge-pill">
                                <i class="fa-solid fa-tag"></i>
                                <span th:text="${article.category.name}">Categoria</span>
                            </a>
                            <span th:if="${article.category == null}" class="badge bg-secondary-subtle text-secondary px-3 py-2 rounded-pill">
                                Generale
                            </span>
                        </div>

                        <!-- Titolo e Sottotitolo -->
                        <h1 class="display-4 font-serif-brand fw-bold mb-3 text-dark" th:text="${article.title}">Titolo dell'articolo</h1>
                        <p class="lead text-muted mb-4" th:text="${article.subtitle}">Sottotitolo esplicativo dell'articolo...</p>

                        <!-- Metadati Autore e Data -->
                        <div class="d-flex align-items-center justify-content-center gap-3 text-muted small border-top border-bottom py-2 d-inline-flex px-4">
                            <span class="d-flex align-items-center">
                                <i class="fa-solid fa-user-pen me-2 text-danger"></i>
                                <a class="text-decoration-none fw-semibold text-dark" th:href="@{/search/{id}(id=${article.user.id})}">
                                    <span th:text="${article.user.username}">Autore</span>
                                </a>
                            </span>
                            <span>•</span>
                            <span class="d-flex align-items-center">
                                <i class="fa-regular fa-clock me-2"></i>
                                <span th:text="${article.publishDate}">Data</span>
                            </span>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Corpo dell'Articolo & Carousel/Media -->
        <article class="container my-5">
            <div class="row justify-content-center">
                <div class="col-lg-10 col-xl-8">

                    <!-- Carosello Immagine -->
                    <div id="carouselExample" class="carousel slide article-carousel mb-5">
                        <div class="carousel-inner">
                            <div class="carousel-item active">
                                <img th:if="${article.image != null}" th:src="${article.image.path}" class="article-carousel-img" alt="Copertina">
                                <img th:unless="${article.image != null}" th:src="@{/default.jpg}" class="article-carousel-img" alt="Copertina default">
                            </div>
                        </div>
                        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
                            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                            <span class="visually-hidden">Previous</span>
                        </button>
                        <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
                            <span class="carousel-control-next-icon" aria-hidden="true"></span>
                            <span class="visually-hidden">Next</span>
                        </button>
                    </div>

                    <!-- Testo dell'articolo con tipografia editoriale -->
                    <div class="article-content-body mb-5">
                        <p th:text="${article.body}"></p>
                    </div>

                    <hr class="border-secondary border-opacity-25 my-5">

                    <!-- Navigazione Torna Indietro -->
                    <div class="d-flex justify-content-between align-items-center">
                        <button type="button" class="btn btn-outline-dark rounded-pill px-4" onclick="goBack()">
                            <i class="fa-solid fa-arrow-left me-2"></i> Torna indietro
                        </button>
                        <a th:href="@{/articles}" class="text-secondary text-decoration-none small fw-semibold">
                            Tutti gli articoli <i class="fa-solid fa-chevron-right ms-1"></i>
                        </a>
                    </div>

                </div>
            </div>
        </article>
    </main>

    <footer th:insert="~{index :: footer}"></footer>
    <script th:replace="~{index :: bootstrapScript}"></script>
    <script>
        function goBack() {
            window.history.back();
        }
    </script>
</body>
</html>
