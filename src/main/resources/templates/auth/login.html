<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{index :: head}"></head>
<body class="d-flex flex-column min-vh-100">
    <header th:insert="~{index :: navbar}"></header>

    <main class="auth-wrapper my-5 flex-grow-1">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-sm-10 col-md-8 col-lg-5">

                    <!-- Alert credenziali errate -->
                    <div th:if="${param.error}" class="alert alert-danger border-0 shadow-sm rounded-4 d-flex align-items-center mb-4" role="alert">
                        <i class="fa-solid fa-circle-exclamation fs-5 me-2 flex-shrink-0 text-danger"></i>
                        <span class="small fw-semibold">Email o Password non validi. Riprova.</span>
                    </div>

                    <!-- Alert avvenuto logout -->
                    <div th:if="${param.logout}" class="alert alert-success border-0 shadow-sm rounded-4 d-flex align-items-center mb-4" role="alert">
                        <i class="fa-solid fa-circle-check fs-5 me-2 flex-shrink-0 text-success"></i>
                        <span class="small fw-semibold">Disconnessione effettuata con successo.</span>
                    </div>

                    <div class="card auth-card">
                        <div class="auth-header">
                            <div class="auth-icon-badge" style="background: var(--pc-gradient-sunset); color: #ffffff; box-shadow: 0 6px 18px var(--pc-red-glow);">
                                <i class="fa-solid fa-right-to-bracket fs-5"></i>
                            </div>
                            <h2 class="font-serif-brand fw-bold mb-1 h3">Bentornato</h2>
                            <p class="text-muted small mb-0">Accedi con il tuo account alla redazione di <span class="text-gradient-sunset fw-bold">Pepito Chronicle</span></p>
                        </div>

                        <div class="card-body p-4 p-md-5">
                            <form method="post" role="form" th:action="@{/login}">
                                
                                <!-- Email (name="username" per Spring Security) -->
                                <div class="mb-3">
                                    <label for="username" class="form-label">
                                        <i class="fa-regular fa-envelope me-1" style="color: var(--pc-purple);"></i> Indirizzo Email
                                    </label>
                                    <input type="text" id="username" name="username" class="form-control" placeholder="nome@esempio.it" required autocomplete="username"/>
                                </div>

                                <!-- Password -->
                                <div class="mb-4">
                                    <label for="password" class="form-label">
                                        <i class="fa-solid fa-lock me-1" style="color: var(--pc-red);"></i> Password
                                    </label>
                                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required autocomplete="current-password"/>
                                </div>

                                <!-- Pulsante Accedi con gradiente Sunset -->
                                <div class="d-grid mb-4">
                                    <button type="submit" class="btn btn-sunset py-3 rounded-pill fw-bold fs-6">
                                        <i class="fa-solid fa-arrow-right-to-bracket me-2"></i> Accedi alla Redazione
                                    </button>
                                </div>

                                <!-- Link Registrazione -->
                                <div class="text-center pt-3 border-top border-light-subtle">
                                    <span class="text-muted small">Non hai ancora un account?</span>
                                    <a th:href="@{/register}" class="auth-link small ms-1 fw-bold text-decoration-none" style="color: var(--pc-purple);">Registrati qui</a>
                                </div>
                            </form>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <footer th:insert="~{index :: footer}"></footer>
    <script th:replace="~{index :: bootstrapScript}"></script>
</body>
</html>
