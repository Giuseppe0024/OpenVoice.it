<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{index :: head}"></head>
<body class="d-flex flex-column min-vh-100">
    <header th:insert="~{index :: navbar}"></header>

    <main class="flex-grow-1 my-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-lg-8">

                    <!-- Titolo e Intro -->
                    <div class="text-center mb-4">
                        <span class="badge badge-sunset text-uppercase px-3 py-2 rounded-pill mb-2">Unisciti a Noi</span>
                        <h1 class="display-6 font-serif-brand fw-bold mb-2" th:text="${title}">Richiesta collaborazione</h1>
                        <p class="text-muted">Presenta la tua candidatura per entrare nella redazione editoriale</p>
                    </div>

                    <!-- Form Card -->
                    <div class="card editor-card-form p-4 p-md-5">
                        <form th:action="@{/operations/career/request/save}" method="POST" th:object="${careerRequest}" enctype="multipart/form-data">
                            
                            <!-- Ruolo desiderato -->
                            <div class="mb-4">
                                <label for="role" class="form-label fw-semibold text-secondary small">Per quale ruolo intendi candidarti?</label>
                                <select id="role" th:field="*{role}" class="form-select form-select-lg rounded-3 fs-6">
                                    <option th:each="role : ${roles}" th:value="${role.id}" th:text="${#strings.substring(role.name, 5)}"></option>
                                </select>
                            </div>

                            <!-- Motivazione -->
                            <div class="mb-4">
                                <label for="body" class="form-label fw-semibold text-secondary small">Motivo della richiesta ed esperienze pregresse</label>
                                <textarea id="body" rows="7" class="form-control rounded-3" th:field="*{body}" placeholder="Raccontaci chi sei, le tue passioni di scrittura o la tua esperienza nella revisione editoriale..."></textarea>
                            </div>

                            <!-- Submit -->
                            <div class="d-grid mt-4">
                                <button type="submit" class="btn btn-sunset py-3 rounded-pill fw-bold">
                                    <i class="fa-solid fa-paper-plane me-2"></i> Invia la tua candidatura
                                </button>
                            </div>

                        </form>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <footer th:insert="~{index :: footer}"></footer>
    <script th:replace="~{index :: bootstrapScript}"></script>
</body>
</html>
