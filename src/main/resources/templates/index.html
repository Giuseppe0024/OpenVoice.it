<!DOCTYPE html>
<html lang="it" 
      xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Aulab Chronicle</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body>

    <!-- NAVBAR FRAGMENT -->
    <nav th:fragment="navbar" class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/}">The Aulab Chronicle</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" th:href="@{/}">Home</a>
                    </li>
                </ul>

                <!-- Sezione Autenticazione / Profilo -->
                <ul class="navbar-nav mb-2 mb-lg-0">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            Account
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdown">
                            <!-- Visibile solo se anonimo (non loggato) -->
                            <li sec:authorize="isAnonymous()">
                                <a class="dropdown-item" th:href="@{/register}">Registrati</a>
                            </li>
                            <li sec:authorize="isAnonymous()">
                                <a class="dropdown-item" th:href="@{/login}">Accedi</a>
                            </li>

                            <!-- Visibile solo se autenticato -->
                            <li sec:authorize="isAuthenticated()">
                                <a class="dropdown-item" th:href="@{/logout}">Esci (Logout)</a>
                            </li>
                        </ul>
                    </li>
                </ul>

                <!-- Messaggio di Benvenuto con Nome e Ruolo dell'utente in sessione -->
                <div sec:authorize="isAuthenticated()" 
                    class="navbar-text ms-3 fw-semibold text-primary" 
                    th:text="${'Benvenuto: ' + #authentication.name + ' - ' + #authentication.principal.authorities[0].authority}">
                    Benvenuto:
                </div>
            </div>
        </div>
    </nav>

    <!-- FOOTER -->
    <footer th:fragment="footer" class="bg-dark text-white mt-5 py-4">
        <div class="container">
            <div class="row justify-content-between align-items-center">
                <div class="col-md-4 mb-3">
                    <h5>Informazioni</h5>
                    <a href="https://aulab.it" target="_blank" class="text-white text-decoration-none">Aulab.it</a>
                </div>
                <div class="col-md-4 mb-3 text-end">
                    <h5>Lavora con noi</h5>
                    <a href="#" class="btn btn-primary">Candidati</a>
                </div>
            </div>
        </div>
        <div class="bg-secondary text-center py-2 mt-3">
            <p class="mb-0 text-white small">&copy; 2026 The Aulab Chronicle. Tutti i diritti riservati.</p>
        </div>
    </footer>

    <!-- BOOTSTRAP SCRIPT FRAGMENT -->
    <script th:fragment="bootstrapScript" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</body>
</html>
